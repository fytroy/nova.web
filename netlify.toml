[build]
# Base directory to change to before starting and relative to repository root.
base = "/"

# Astro builds the static site into ./dist
publish = "dist"

# Install deps and build with Astro
command = "npm run build"

# Netlify Forms: the contact form on the homepage posts to /thank-you directly,
# which Astro builds as a real static page — no redirect rule needed.
